<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Site - Login & Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="admin-link">
        <a href="admin.html" target="_blank" title="View all registered users">📊 Admin Panel</a>
    </div>

    <div class="container">
        <!-- Login Form -->
        <div class="form-container" id="loginForm">
            <h2>Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password:</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <p class="toggle-text">Don't have an account? <a href="#" onclick="toggleForms()">Register here</a></p>
            </form>
            <div id="loginMessage" class="message"></div>
        </div>

        <!-- Registration Form -->
        <div class="form-container hidden" id="registrationForm">
            <h2>Register</h2>
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="regName">Full Name:</label>
                    <input type="text" id="regName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email:</label>
                    <input type="email" id="regEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password:</label>
                    <input type="password" id="regPassword" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password:</label>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                <p class="toggle-text">Already have an account? <a href="#" onclick="toggleForms()">Login here</a></p>
            </form>
            <div id="registrationMessage" class="message"></div>
        </div>

        <!-- Dashboard (shown after successful login) -->
        <div class="dashboard hidden" id="dashboard">
            <div class="dashboard-header">
                <h2>Welcome, <span id="userName">User</span>!</h2>
                <button class="btn btn-logout" onclick="handleLogout()">Logout</button>
            </div>
            <div class="dashboard-content">
                <p>You are successfully logged in.</p>
                <div class="user-info">
                    <h3>Your Information:</h3>
                    <p><strong>Email:</strong> <span id="userEmail"></span></p>
                    <p><strong>Member Since:</strong> <span id="joinDate"></span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
