<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - View Users</title>
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Admin Panel - User Database</h1>
            <div class="header-actions">
                <button class="btn btn-refresh" onclick="loadUsers()">Refresh</button>
                <a href="index.html" class="btn btn-back">Back to Auth</a>
            </div>
        </div>

        <div class="admin-content">
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Users</h3>
                    <p class="stat-number" id="totalUsers">0</p>
                </div>
            </div>

            <div class="users-section">
                <h2>All Registered Users</h2>
                <div id="loadingMessage" class="message info">Loading users...</div>
                
                <div class="table-wrapper">
                    <table id="usersTable" class="users-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Join Date</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersBody">
                            <tr>
                                <td colspan="6" class="text-center">No users found</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- User Details Modal -->
            <div id="userModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>User Details</h2>
                        <span class="close" onclick="closeModal()">&times;</span>
                    </div>
                    <div class="modal-body" id="userDetails">
                        <!-- User details will be inserted here -->
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-danger" onclick="deleteUserConfirm()">Delete User</button>
                        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="admin-script.js"></script>
</body>
</html>
